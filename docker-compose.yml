services:
  # PostgreSQL - Primary database
  fin-postgres:
    image: postgres:16-alpine
    container_name: fin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      POSTGRES_DB: fin
    ports:
      # localhost + Tailscale only — never the LAN. The app reaches Postgres
      # over the docker network; these published ports are for host/remote psql.
      - "127.0.0.1:5433:5432"
      - "100.94.46.62:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - fin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      # Build provenance (Known Issue #17) — deploy-to-production.sh exports these; a bare
      # `docker compose build` still works and stamps "unknown".
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: fin-server
    restart: unless-stopped
    depends_on:
      fin-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://fin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}@fin-postgres:5432/fin
      ACCOUNT_NAMES_PATH: ../../components/data/account_names.json
      CATEGORY_NAMES_PATH: ../../components/data/category_names.json
      COA_PATH: ../../components/data/coa.json
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://192.168.1.61:8080}
      BANK_FEED_URL: ${BANK_FEED_URL:-http://host.docker.internal:3007}
      BANK_FEED_API_KEY: ${BANK_FEED_API_KEY:-}
    extra_hosts:
      # Lets the container reach bank-feed at the host's published 3007 port
      # via host.docker.internal on Linux (CR021 Phase 7).
      - "host.docker.internal:host-gateway"
    ports:
      # CR082 P0b: loopback ONLY. This was "3005:3005" — every interface — so the
      # whole API answered anything on the LAN or the tailnet, bypassing nginx
      # entirely. Proved rather than argued: a plain
      #   curl http://192.168.1.87:3005/api/v2/util/coa-traits
      # returned all 230 accounts, each with its AccountNumber, unauthenticated.
      # CR082 is about to put full foreign bank account numbers in that column,
      # so auth on the proxy alone would have looked like a fix while leaving the
      # real door open. Same reasoning as CR034's DB binding, one notch tighter:
      # nginx reaches the API as server:3005 over the docker network (host
      # publishing is irrelevant to it), and the 06:00 feed cron uses
      # localhost:3005, so neither is affected.
      - "127.0.0.1:3005:3005"
    volumes:
      - ./components/data:/app/components/data
      - ./components/reports:/app/components/reports
    networks:
      - fin-network

  # Frontend (PostgreSQL/v2 API)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-2.0.0}
        VITE_APP_MODE: prod
        VITE_APP_API: ""
        VITE_NAV_LAYOUT: sidebar
        # Build provenance (Known Issue #17) — see server above.
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: fin-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # CR082 P0b: loopback ONLY, so the UI is reachable exclusively over the
      # tailnet. `tailscale serve` already fronts this —
      #   https://fin.tail413695.ts.net -> https+insecure://localhost:5175
      # — and it runs ON the host, so a 127.0.0.1 binding is all it needs. What
      # this removes is the parallel unauthenticated door: these were published
      # on every interface, so http://192.168.1.87:3006 served the whole app,
      # COA page included, to anything on the house network.
      #
      # Tailscale's own device auth is the gate. Chosen over nginx basic-auth
      # (owner, 2026-08-15): no shared password to manage or leak, no browser
      # prompt fighting the installed PWA's service worker, and the tailnet is
      # already an authenticated network.
      #
      # ⚠️ Consequence, and it is the point: fin is no longer reachable from the
      # LAN at all. Any device that used http://192.168.1.87:3006 must join the
      # tailnet and use the ts.net URL.
      - "127.0.0.1:3006:80"
      - "127.0.0.1:5175:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fin-network

networks:
  fin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    # Pinned: the prod data volume was created under the legacy compose
    # project "fin"; pinning the name lets the canonical "psproject" project
    # (see deploy-to-production.sh) adopt it instead of creating a fresh one.
    name: fin_postgres_data

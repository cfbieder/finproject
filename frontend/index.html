<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-v3.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192-v3.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180-v3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6F8" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fin" />
    <meta name="description" content="Personal finance management and forecasting" />
    <!-- Inter, self-hosted (CR105 P1; replaces Outfit, which was self-hosted by CR042 for the
         same reasons: no third-party request, works offline in the PWA, no FOUT). Inter v20 is
         a variable font, so all weights come from two files. Preloading latin kills the swap
         flash for everything but extended glyphs. -->
    <link
      rel="preload"
      href="/fonts/inter-UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/inter.css" />
    <title>FI</title>
    <script>
      /* CR026 P2 — apply saved theme before paint to avoid a flash.
         Defaults to light (kept in sync by hooks/useTheme.js). */
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
